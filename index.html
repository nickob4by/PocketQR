<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>PocketQR - Philippine QR Ph Wallet</title>

    <!-- Prevent iOS from converting bank/mobile numbers into phone call links -->
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="description" content="Local-first offline QR Ph payment wallet for GCash, Maya, RCBC, and Philippine banks." />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PocketQR" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons: Favicon, PWA & Apple Touch Icons for iPhones and iPads -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Plus Jakarta Sans, Space Grotesk, Space Mono & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#10131a] text-[#e0e2ec] selection:bg-[#00f0a0] selection:text-[#003822] overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
