<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005CE6" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#00D66F" />
    </linearGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="#0A0F1D" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" opacity="0.25" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Top-Left Finder Pattern -->
  <rect x="80" y="80" width="130" height="130" rx="28" fill="url(#qrGrad)" />
  <rect x="106" y="106" width="78" height="78" rx="16" fill="#0A0F1D" />
  <rect x="126" y="126" width="38" height="38" rx="8" fill="#38BDF8" />

  <!-- Top-Right Finder Pattern -->
  <rect x="302" y="80" width="130" height="130" rx="28" fill="url(#qrGrad)" />
  <rect x="328" y="106" width="78" height="78" rx="16" fill="#0A0F1D" />
  <rect x="348" y="126" width="38" height="38" rx="8" fill="#38BDF8" />

  <!-- Bottom-Left Finder Pattern -->
  <rect x="80" y="302" width="130" height="130" rx="28" fill="url(#qrGrad)" />
  <rect x="106" y="328" width="78" height="78" rx="16" fill="#0A0F1D" />
  <rect x="126" y="348" width="38" height="38" rx="8" fill="#4ADE80" />

  <!-- Center Decorative Matrix Blocks -->
  <rect x="236" y="100" width="40" height="40" rx="10" fill="#38BDF8" opacity="0.9" />
  <rect x="236" y="165" width="40" height="80" rx="10" fill="url(#qrGrad)" />
  <rect x="100" y="236" width="70" height="40" rx="10" fill="#38BDF8" opacity="0.8" />
  <rect x="302" y="236" width="50" height="40" rx="10" fill="#4ADE80" opacity="0.9" />

  <!-- Bottom-Right Matrix Modules -->
  <rect x="302" y="302" width="55" height="55" rx="14" fill="#4ADE80" />
  <rect x="377" y="302" width="55" height="55" rx="14" fill="#38BDF8" />
  <rect x="302" y="377" width="55" height="55" rx="14" fill="#38BDF8" />
  <rect x="377" y="377" width="55" height="55" rx="14" fill="#4ADE80" />

  <!-- Center Philippine Sun/Star Accent Badge -->
  <circle cx="256" cy="285" r="30" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="256" cy="285" r="24" fill="#FBBF24" />
</svg>
