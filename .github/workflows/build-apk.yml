name: Build PocketQR Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.28)'
        required: false
        default: '1.0.28'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Determine Version
        id: versioning
        run: |
          VERSION="1.0.28"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        env:
          BUILD_NUMBER: 28
          BUILD_VERSION: ${{ steps.versioning.outputs.version }}

      - name: Rename APK for Easy Identification
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./PocketQR.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketQR-apk
          path: ./PocketQR.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.versioning.outputs.version }}"
          name: "PocketQR v${{ steps.versioning.outputs.version }}"
          body: |
            ### 📱 PocketQR Android APK Release

            **Download the attached `PocketQR.apk` file directly on your Android phone to install!**

            #### ✨ What's Included:
            * **Cyber Zoom Adjuster (0.6x Wide-Angle FOV, 1x Standard, 2x Tele, +/- steppers, pinch-to-zoom)**
            * **Scaled Full-Screen Cyber Viewfinder (Edge-to-edge camera matching phone aspect ratio)**
            * **Duplicate QR detection & prevention utility**
            * **Real Android "Open with" System Chooser**
            * **Native `PackageManager` detection for installed Philippine banking apps (GCash, Maya, RCBC, etc.)**
            * **Zero web browser sandboxing or Play Store redirection**
            * **Full offline QR Ph payment card wallet**
          files: ./PocketQR.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
