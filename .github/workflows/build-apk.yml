name: Build PocketQR Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./PocketQR.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketQR-apk
          path: ./PocketQR.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PocketQR v1.0.${{ github.run_number }}"
          body: |
            ### 📱 PocketQR Android APK Release

            **Download the attached `PocketQR.apk` file directly on your Android phone to install!**

            #### ✨ What's Included:
            * **Real Android "Open with" System Chooser**
            * **Native `PackageManager` detection for installed Philippine banking apps (GCash, Maya, RCBC, etc.)**
            * **Zero web browser sandboxing or Play Store redirection**
            * **Full offline QR Ph payment card wallet**
          files: ./PocketQR.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
